services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm_dev
      POSTGRES_DB: pm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  playwright-mcp:
    image: mcr.microsoft.com/playwright:latest
    # ponytail: image bundles chromium-1129 but mcp 0.0.79 wants 1237 — install the
    # matching browser into a persistent volume once. Bump both together on upgrade.
    command: ["sh", "-c", "npx -y playwright-core@1.63.0-alpha-2026-08-05 install chromium && npx -y @playwright/mcp@0.0.79 --headless --browser chromium --isolated --host 0.0.0.0 --port 8931"]
    ports:
      - "8931:8931"
    volumes:
      - playwright_browsers:/ms-playwright

# Application services (api, web) use condition: service_healthy to wait for
# postgres and redis before starting. Example (added when containerizing in later phase):
# api:
#   depends_on:
#     postgres:
#       condition: service_healthy
#     redis:
#       condition: service_healthy

volumes:
  postgres_data:
  playwright_browsers:
