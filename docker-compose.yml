services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pm
      POSTGRES_PASSWORD: pm_dev
      POSTGRES_DB: pm_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pm -d pm_dev"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

# Application services (api, web) use condition: service_healthy to wait for
# postgres and redis before starting. Example (added when containerizing in later phase):
# api:
#   depends_on:
#     postgres:
#       condition: service_healthy
#     redis:
#       condition: service_healthy

volumes:
  postgres_data:
